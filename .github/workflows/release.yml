name: Release archive

# On a version tag: the built page as one archive attached to the GitHub
# release, whose notes are generated from the commit subjects since the last
# tag, as pubky-homeserver does. This is what the README's "Run it for your
# homeserver" downloads.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  # Builds with a read-only token: dependencies' install scripts and the build
  # run here, and none of them needs to write to the repository.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # The archive is named after the version in package.json, which the page
      # also shows in its footer; a tag that does not match it would publish a
      # release whose archive says another version.
      - name: Check the tag against package.json
        run: test "v$(node --print "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Build the page
        run: npm run build

      - name: Pack the archive and smoke-test it
        run: |
          archive="$(scripts/release-archive.sh)"
          scripts/smoke-test-archive.sh "$archive"

      - name: Hand the archive to the publish job
        uses: actions/upload-artifact@v7
        with:
          name: release-archive
          path: release/*.tar.gz
          if-no-files-found: error

  # The only job that may write: it attaches what the build job produced.
  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      # Groups the conventional-commit subjects between the previous tag and
      # this one. It has nothing to compare the first tag with, so it may fail
      # there; the release then gets GitHub's own generated notes.
      - name: Generate the release notes
        id: notes
        continue-on-error: true
        uses: requarks/changelog-action@v1
        with:
          token: ${{ github.token }}
          tag: ${{ github.ref_name }}
          excludeTypes: ''
          useGitmojis: false
          writeToFile: false

      - name: Fetch the archive
        uses: actions/download-artifact@v8
        with:
          name: release-archive
          path: release

      # A release someone made by hand for the tag keeps the notes they wrote.
      - name: Attach the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: ${{ steps.notes.outputs.changes }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [[ -n "$NOTES" ]]; then
              gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "$NOTES"
            else
              gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
            fi
          fi
          gh release upload "$GITHUB_REF_NAME" release/*.tar.gz --clobber
